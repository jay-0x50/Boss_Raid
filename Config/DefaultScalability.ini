; Keep the Epic look while fitting the runtime renderer into a 4 GB GPU budget.
; Only the memory-heavy caches are reduced; lighting and material quality stay Epic.

[AntiAliasingQuality@3]
; Epic normally keeps TSR history at 200%, which allocates 4K history at 1080p.
r.TSR.History.ScreenPercentage=100

[ShadowQuality@3]
; The compact submission map stays sharp with 75% of the High page pool,
; leaving headroom for capture software on a 4 GB GPU.
r.Shadow.Virtual.MaxPhysicalPages=1536

[TextureQuality@3]
; Keep mip bias at zero while preventing the streaming pool from crowding other GPU resources.
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=700
